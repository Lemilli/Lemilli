<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="380" viewBox="0 0 1300 380" role="img" aria-labelledby="title desc">
  <title id="title">Alibek Kapan — Software Engineer</title>
  <desc id="desc">Dark violet editorial banner with a glowing technology orbit around a code symbol and labels for Flutter, Django, Node.js, Android TV, AI and Unity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0815"/><stop offset=".54" stop-color="#14102c"/><stop offset="1" stop-color="#090c19"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c3aed" stop-opacity=".34"/><stop offset=".48" stop-color="#6d28d9" stop-opacity=".10"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="thin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".4"/><stop offset="1" stop-color="#c4b5fd" stop-opacity=".06"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#b4a3fb" stroke-opacity=".065" stroke-width=".8"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect x="0" y="0" width="1300" height="380" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1300" height="380" rx="20" fill="url(#grid)"/>
  <ellipse cx="1026" cy="192" rx="300" ry="245" fill="url(#glow)"/>
  <circle cx="945" cy="184" r="96" fill="#7032d7" opacity=".16" filter="url(#blur)"/>
  <path d="M 0 12 L 1300 12" stroke="#8b5cf6" stroke-width="2" opacity=".55"/>
  <path d="M 36 38 H 112" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <text x="52" y="89" fill="#a78bfa" font-size="16" font-weight="700" letter-spacing="4" font-family="DejaVu Sans, Arial, sans-serif">SOFTWARE ENGINEER  /  FULL-STACK BUILDER</text>
  <text x="48" y="182" fill="#f6f4ff" font-size="73" font-weight="800" font-family="DejaVu Sans, Arial, sans-serif">ALIBEK</text>
  <text x="48" y="259" fill="url(#violet)" font-size="73" font-weight="800" font-family="DejaVu Sans, Arial, sans-serif">KAPAN</text>
  <rect x="52" y="286" width="560" height="1.5" fill="#7c3aed" opacity=".6"/>
  <text x="52" y="318" fill="#d9d3f4" font-size="20" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif">Mobile  ·  Backend  ·  Web  ·  AI  ·  XR</text>
  <text x="52" y="350" fill="#8881aa" font-size="15" font-family="DejaVu Sans, Arial, sans-serif">ASTANA, KAZAKHSTAN   /   BUILDING ACROSS PLATFORMS</text>
  <!-- The technical orbit -->
  <g transform="translate(996 193) scale(.9)">
