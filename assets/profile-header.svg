    <g fill="#a78bfa"><circle cx="-104" cy="-114" r="3"/><circle cx="121" cy="-84" r="3"/><circle cx="174" cy="21" r="3"/><circle cx="-132" cy="93" r="3"/><circle cx="2" cy="-148" r="3"/><circle cx="27" cy="150" r="3"/></g>
