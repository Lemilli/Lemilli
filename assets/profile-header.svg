    <ellipse rx="188" ry="148" transform="rotate(29)" fill="none" stroke="#b09bfb" stroke-opacity=".25" stroke-width="1.4"/>
    <circle r="89" fill="#15132d" stroke="#9e7df9" stroke-opacity=".5" stroke-width="1.4"/>
    <circle r="74" fill="#1a1636" stroke="#c4b5fd" stroke-opacity=".12"/>
    <text x="0" y="9" fill="#ddd6fe" text-anchor="middle" font-size="61" font-weight="700" font-family="monospace">&lt;/&gt;</text>
    <text x="0" y="39" fill="#9484ce" text-anchor="middle" font-size="10" letter-spacing="1.5" font-family="DejaVu Sans, Arial, sans-serif">BUILD · SHIP · SCALE</text>
    <g fill="#16132e" stroke="#a78bfa" stroke-opacity=".50" stroke-width="1.2">
      <rect x="-256" y="-149" width="111" height="38" rx="19"/>
      <rect x="139" y="-134" width="111" height="38" rx="19"/>
      <rect x="173" y="51" width="112" height="38" rx="19"/>
      <rect x="-260" y="90" width="119" height="38" rx="19"/>
      <rect x="-87" y="-184" width="101" height="34" rx="17"/>
      <rect x="29" y="160" width="92" height="34" rx="17"/>
